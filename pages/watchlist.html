    <style>
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .animate-marquee {
            display: inline-block;
            animation: marquee 15s linear infinite;
        }
        
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        .section-divider {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Scrollbar styling */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Responsive banner ads */
        .banner-ad-wrapper {
            width: 100%;
            max-width: 728px;
            margin: 0 auto;
            padding: 10px 0;
        }
        
        .banner-ad-container {
            width: 100%;
            max-width: 728px;
            height: 90px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 0 auto;
        }
        
        .banner-ad-container ins {
            display: block;
            width: 728px !important;
            height: 90px !important;
        }
        
        /* Adsterra Responsive Fix */
        .ad-container {
            width: 100%;
            overflow: hidden;
            text-align: center;
        }
        
        .ad-container iframe,
        .ad-container img {
            width: 100% !important;
            height: auto !important;
            display: block;
            margin: 0 auto;
            max-width: 100% !important;
        }
        
        /* Desktop and mobile ad variants */
        .ad-desktop {
            display: block;
            width: 100%;
        }
        
        .ad-mobile {
            display: none;
            width: 100%;
        }
        
        /* Force override for fixed-size ads */
        *[style*="width"] {
            width: 100% !important;
            max-width: 100% !important;
        }
        
        *[style*="height"] {
            height: auto !important;
        }
        
        /* Mobile ad adjustments */
        @media (max-width: 768px) {
            .banner-ad-container {
                max-width: 100%;
                padding: 0 10px;
                height: auto;
            }
            
            .banner-ad-container ins {
                max-width: 100%;
                width: 100% !important;
                display: block;
            }
        }
        
        @media (max-width: 480px) {
            .banner-ad-container {
                height: auto;
            }
            
            .banner-ad-container ins {
                height: auto;
            }
        }
        
        /* Switch between desktop and mobile ads */
        @media (max-width: 600px) {
            .ad-desktop {
                display: none !important;
                visibility: hidden !important;
            }
            
            .ad-mobile {
                display: block !important;
                visibility: visible !important;
            }
            
            .banner-ad-wrapper {
                max-width: 320px;
                padding: 8px 0;
            }
            
            .banner-ad-container {
                max-width: 320px;
                height: 50px;
            }
            
            .banner-ad-container ins {
                width: 320px !important;
                height: 50px !important;
            }
        }
        
        @media (min-width: 601px) {
            .ad-desktop {
                display: block !important;
                visibility: visible !important;
            }
            
            .ad-mobile {
                display: none !important;
                visibility: hidden !important;
            }
        }
        
        /* Additional responsive fixes for ad containers */
        @media (max-width: 768px) {
            .banner-ad-container {
                max-width: 100%;
                padding: 0 10px;
            }
            
            .banner-ad-container ins {
                max-width: 100% !important;
                width: 100% !important;
            }
        }
        
        /* Ensure ads maintain aspect ratio */
        .ad-container iframe,
        .ad-container ins {
            aspect-ratio: auto !important;
        }
        
        .ad-desktop .banner-ad-container ins {
            aspect-ratio: 728/90 !important;
        }
        
        .ad-mobile .banner-ad-container ins {
            aspect-ratio: 320/50 !important;
        }
        
        /* Enhanced watchlist card styles */
        .watchlist-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .watchlist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .watchlist-card-img {
            height: 300px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .watchlist-card:hover .watchlist-card-img {
            transform: scale(1.05);
        }
        
        .remove-btn {
            transition: all 0.2s ease;
        }
        
        .remove-btn:hover {
            transform: scale(1.1);
            background-color: #ef4444 !important;
        }
        
        /* Rating badge */
        .rating-badge {
            background: linear-gradient(135deg, #22d3ee, #3b82f6);
        }
    </style>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 pb-20">

    <!-- Ad Modal -->
    <div id="adModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 10000; backdrop-filter: blur(3px); justify-content: center; align-items: center;">
        <div style="position: relative; background: #1e293b; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); max-width: 330px; width: 90vw; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <button id="closeAdModal" style="position: absolute; top: 10px; right: 10px; background: #22d3ee; color: #0f172a; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; z-index: 10001; display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1; padding: 0; margin: 0; box-sizing: border-box;">&times;</button>
            <div id="adContainer" style="margin-top: 30px; width: 300px; height: 250px; display: flex; align-items: center; justify-content: center; background: #0f172a; border-radius: 8px; position: relative;">
                <div id="adLoadingIndicator" style="color: #94a3b8; font-size: 14px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;">Loading advertisement...</div>
                <script type="text/javascript">
                    atOptions = {
                        'key' : 'e65cc55a1c5f4c4ff04d43a949ba5eea',
                        'format' : 'iframe',
                        'height' : 250,

                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="//www.highperformanceformat.com/e65cc55a1c5f4c4ff04d43a949ba5eea/invoke.js"></script>
            </div>
        </div>
    </div>
    
    <script>
        // Show ad modal on page load
        window.addEventListener('DOMContentLoaded', function() {
            // Show the ad modal
            const adModal = document.getElementById('adModal');
            if (adModal) {
                adModal.style.display = 'flex';
                
                // Add close functionality
                const closeBtn = document.getElementById('closeAdModal');
                if (closeBtn) {
                    closeBtn.addEventListener('click', function() {
                        adModal.style.display = 'none';
                    });
                }
                
                // Close modal when clicking outside the content
                adModal.addEventListener('click', function(e) {
                    if (e.target === adModal) {
                        adModal.style.display = 'none';
                    }
                });
                
                // Close modal with ESC key
                document.addEventListener('keydown', function closeOnEsc(e) {
                    if (e.key === 'Escape' && adModal.style.display === 'flex') {
                        adModal.style.display = 'none';
                        document.removeEventListener('keydown', closeOnEsc);
                    }
                });
            }
        });
    </script>

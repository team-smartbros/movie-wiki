    <style>
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);

        .animate-marquee {
            display: inline-block;
            animation: marquee 15s linear infinite;

            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }

        .section-divider {

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Responsive banner ads */
        .banner-ad-wrapper {
            width: 100%;
            max-width: 728px;
            margin: 0 auto;
            padding: 10px 0;
        }
        
        .banner-ad-container {
            width: 100%;
            max-width: 728px;
            height: 90px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 0 auto;
            /* Fix for ad shifting up */
            line-height: 0;
        }
        
        .banner-ad-container ins {
            display: block;
            width: 728px !important;
            height: 90px !important;
            /* Remove object-fit to prevent shifting */
        }
        
        /* Adsterra Responsive Fix */
        .ad-container {
            width: 100%;
            overflow: hidden;
            text-align: center;
        }
        
        .ad-container iframe,
        .ad-container img {
            width: 100% !important;
            height: 100% !important;
            display: block;
            margin: 0 auto;
            max-width: 100% !important;
            /* Remove object-fit to prevent shifting */
        }
        
        /* Desktop and mobile ad variants */
        .ad-desktop {
            display: block;
            width: 100%;
        }
        
        .ad-mobile {
            display: none;
            width: 100%;
        }
        
        /* Force override for fixed-size ads */
        *[style*="width"] {
            width: 100% !important;
            max-width: 100% !important;
        }
        
        *[style*="height"] {
            height: 100% !important;
        }
        
        /* Mobile ad adjustments */
        @media (max-width: 768px) {
            .banner-ad-container {
                max-width: 100%;
                padding: 0 10px;
                height: auto;
            }
            
            .banner-ad-container ins {
                max-width: 100%;
                width: 100% !important;
                display: block;
                /* Remove object-fit to prevent shifting */
            }
        }
        
        @media (max-width: 480px) {
            .banner-ad-container {
                height: auto;
            }
            
            .banner-ad-container ins {
                height: auto;
                /* Remove object-fit to prevent shifting */
            }
        }
        
        /* Switch between desktop and mobile ads */
        @media (max-width: 600px) {
            .ad-desktop {
                display: none;
            }
            .ad-mobile {
                display: block;
            }
            
            .banner-ad-wrapper {
                max-width: 320px;
                padding: 8px 0;
            }
            
            .banner-ad-container {
                max-width: 320px;
                height: 50px;
                /* Fix for ad shifting up */
                line-height: 0;
            }
            
            .banner-ad-container ins {
                width: 320px !important;
                height: 50px !important;
                /* Remove object-fit to prevent shifting */
            }
        }
        
        /* Additional responsive fixes for ad containers */
        @media (max-width: 768px) {
            .banner-ad-container {
                max-width: 100%;
                padding: 0 10px;
            }
            
            .banner-ad-container ins {

                /* Remove object-fit to prevent shifting */
            }

            /* Remove object-fit to prevent shifting */
        }
        
        .ad-desktop .banner-ad-container ins {

        }
        
        .ad-mobile .banner-ad-container ins {

        #adContainer {

            outline: none !important;

            position: absolute !important;
            top: 50% !important;

            transform: translate(-50%, -50%) !important;
            z-index: 1 !important;

            animation-duration: 0s !important;

        /* Enhanced watchlist card styles */
        .watchlist-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .watchlist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .watchlist-card-img {
            height: 300px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .watchlist-card:hover .watchlist-card-img {
            transform: scale(1.05);
        }
        
        .remove-btn {
            transition: all 0.2s ease;
        }
        
        .remove-btn:hover {
            transform: scale(1.1);

        }
        
        /* Rating badge */
        .rating-badge {
            background: linear-gradient(135deg, #22d3ee, #3b82f6);
        }

    <script>
        // Ensure mobile ads are displayed correctly
        document.addEventListener('DOMContentLoaded', function() {
            // Force display of correct ad type based on screen size
            function adjustAdDisplay() {
                const isMobile = window.innerWidth <= 600;
                const desktopAds = document.querySelectorAll('.ad-desktop');
                const mobileAds = document.querySelectorAll('.ad-mobile');
                
                desktopAds.forEach(ad => {
                    ad.style.display = isMobile ? 'none' : 'block';
                });
                
                mobileAds.forEach(ad => {
                    ad.style.display = isMobile ? 'block' : 'none';
                });
            }
            
            // Adjust on load
            adjustAdDisplay();
            
            // Adjust on resize
            window.addEventListener('resize', adjustAdDisplay);
        });
        
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../js/sw.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered with scope:', registration.scope);
                    })
                    .catch(error => {
                        console.log('❌ Service Worker registration failed:', error);
                    });
            });
        }
    </script>

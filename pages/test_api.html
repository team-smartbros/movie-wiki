<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#22d3ee">
    <meta name="description" content="Discover movies, actors, and trailers with Movie Wiki. Your ultimate destination for movie information.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Movie Wiki">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
</head>
<body>
    <h1>API Test</h1>
    <button onclick="testScraperAPI()">Test Scraper API</button>
    <button onclick="testMovieAPI()">Test Movie API</button>
    <div id="results"></div>

    <script>
        const SCRAPER_API_BASE = 'https://web-1-production.up.railway.app';
        const API_BASE = 'https://imdb.iamidiotareyoutoo.com';
        
        async function testScraperAPI() {
            try {
                const response = await fetch(`${SCRAPER_API_BASE}/top`);
                const data = await response.json();
                document.getElementById('results').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('results').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
        
        async function testMovieAPI() {
            try {
                const response = await fetch(`${API_BASE}/search?q=batman`);
                const data = await response.json();
                document.getElementById('results').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('results').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>

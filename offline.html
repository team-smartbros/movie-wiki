<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Wiki - Offline</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a;
            color: #fff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .logo {
            font-size: 3rem;
            color: #22d3ee;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #22d3ee;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #cbd5e1;
        }
        .retry-btn {
            background-color: #22d3ee;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .retry-btn:hover {
            background-color: #06b6d4;
        }
        .offline-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-icon">
            <i class="fas fa-wifi"></i>
        </div>
        <h1>You're Offline</h1>
        <p>It seems you've lost your internet connection. Please check your network settings and try again.</p>
        <p>Movie Wiki PWA will automatically reconnect when your internet is restored.</p>
        <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
    
    <script>
        // Check if online status changes
        window.addEventListener('online', function() {
            window.location.href = '/';
        });
    </script>
</body>
</html>

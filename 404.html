<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Client-side routing for GitHub Pages
    (function() {
      var path = location.pathname;
      var query = location.search;
      
      // Remove trailing slash if present
      if (path.endsWith('/') && path.length > 1) {
        path = path.slice(0, -1);
      }
      
      // If the path doesn't end with .html, try to redirect to the .html version
      if (!path.endsWith('.html') && path.indexOf('.') === -1) {
        // Special case for root
        if (path === '' || path === '/') {
          window.location.replace('/index.html');
          return;
        }
        
        // Try to load the .html version
        var newPath = path + '.html';
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', newPath, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              window.location.replace(newPath + query);
            } else {
              // If not found, redirect to homepage
              window.location.replace('/index.html');
            }
          }
        };
        xhr.send();
      } else {
        // If we're already on a .html page, redirect to clean URL
        if (path.endsWith('.html')) {
          var cleanPath = path.slice(0, -5);
          if (cleanPath === '') cleanPath = '/';
          window.location.replace(cleanPath + query);
        }
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
